name: Build Bikam Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Flet and Build APK
        run: |
          pip install flet requests
          flet build apk --project "بكم اليوم" --product "بكم اليوم؟" --org "com.yemen.bikam"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BikamAlyoum-APK
          path: build/apk/*.apk
