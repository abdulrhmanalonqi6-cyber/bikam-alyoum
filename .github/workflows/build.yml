name: Build Bikam APK
on:
  push:
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Flet and Build APK
        run: |
          pip install --upgrade pip
          pip install flet
          flet build apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BikamAlyoum-APK
          path: build/apk/*.apk
          if-no-files-found: error
